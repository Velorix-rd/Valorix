    <!-- Instant Canonical Host Redirect from DuckDNS to GitHub Pages -->
    <script>
      (function() {
        try {
          var host = window.location.hostname;
          if (host === 'share-files-rd.duckdns.org' || host.indexOf('duckdns.org') !== -1) {
            var targetPath = window.location.pathname;
            if (targetPath.startsWith('/')) targetPath = targetPath.slice(1);
            var targetUrl = 'https://velorix-rd.github.io/Valorix/' + (targetPath ? targetPath : '') + window.location.search + window.location.hash;
            window.location.replace(targetUrl);
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <!-- GitHub Pages SPA Redirect Handler -->
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var shareParam = params.get('share') || params.get('file') || params.get('id');
          if (shareParam) {
            sessionStorage.setItem('velorix_share_id', shareParam);
            try { localStorage.setItem('velorix_last_share_id', shareParam); } catch (e) {}
          }
          var pParam = params.get('p');
          if (pParam) {
            var decodedPath = decodeURIComponent(pParam);
            var m = decodedPath.match(/\/share\/([a-zA-Z0-9_-]+)/i);
            if (m && m[1]) {
              sessionStorage.setItem('velorix_share_id', m[1]);
              try { localStorage.setItem('velorix_last_share_id', m[1]); } catch (e) {}
            }
            // Restore clean path in browser address bar
            window.history.replaceState(null, null, decodedPath);
          }
          var redirect = sessionStorage.redirect;
          if (redirect) {
            delete sessionStorage.redirect;
            if (redirect !== location.href) {
              window.history.replaceState(null, null, redirect);
            }
          }
        } catch (err) {
          // ignore
        }
      })();
    </script>

    <div id="root">
      <div id="velorix-loader" style="min-height: 100vh; background-color: #030303; display: flex; align-items: center; justify-content: center; color: #00FF9D; font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center; max-width: 360px; padding: 20px;">
          <div style="width: 48px; height: 48px; border: 3px solid rgba(0, 255, 157, 0.2); border-top-color: #00FF9D; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px auto;"></div>
          <div style="font-weight: 800; letter-spacing: 0.15em; font-size: 14px; text-transform: uppercase;">VELORIX</div>
          <div id="loader-subtext" style="font-size: 11px; color: #71717a; margin-top: 4px;">Loading Secure Vault...</div>
          
          <div id="loader-fallback" style="display: none; margin-top: 18px;">
            <p style="font-size: 12px; color: #a1a1aa; margin-bottom: 12px; line-height: 1.5;">
              Connection taking longer than expected. If self-hosting on DuckDNS, ensure your Node server is running.
            </p>
            <button onclick="window.location.reload()" style="background: #00FF9D; color: #000; border: none; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: bold; cursor: pointer;">
              Retry Connection
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      // Graceful timeout check for slow or disconnected server hosts
      setTimeout(function() {
        var loader = document.getElementById('loader-fallback');
        var subtext = document.getElementById('loader-subtext');
        if (loader && document.getElementById('velorix-loader')) {
          loader.style.display = 'block';
          if (subtext) subtext.innerText = 'Connecting to server...';
        }
      }, 5000);
    </script>
    <style>

        to { transform: rotate(360deg); }
