<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Velorix | Secure File Transfer</title>
    <script type="text/javascript">
      // GitHub Pages SPA Routing Handler for Velorix
      (function() {
        try {
          var loc = window.location;
          var path = loc.pathname || '';
          var origin = loc.origin || '';

          // Check if path contains /share/:id (preserving full filenames, extensions, and encoded characters)
          var shareMatch = path.match(/\/share\/([^/?#]+)/i);
          var shareId = shareMatch ? decodeURIComponent(shareMatch[1].trim()) : null;

          if (shareId) {
            sessionStorage.setItem('velorix_share_id', shareId);
            try { localStorage.setItem('velorix_last_share_id', shareId); } catch (e) {}
          }

          sessionStorage.setItem('velorix_redirect_url', loc.href);

          // Detect repository subpath (e.g. /Valorix/ or /velorix/)
          var segments = path.split('/').filter(Boolean);
          var hasRepoPrefix = segments.length > 0 && (segments[0].toLowerCase() === 'valorix' || segments[0].toLowerCase() === 'velorix');
          var basePath = hasRepoPrefix ? '/' + segments[0] : (path.indexOf('/Valorix') !== -1 ? '/Valorix' : '');

          // Redirect to index.html with clean query parameters
          var redirectTarget = origin + basePath + '/?' + 
            (shareId ? 'share=' + encodeURIComponent(shareId) + '&' : '') +
            'p=' + encodeURIComponent(path + loc.search + loc.hash);

          window.location.replace(redirectTarget);
        } catch (err) {
          // Fallback redirect preserving repository path
          var repoPath = window.location.pathname.indexOf('/Valorix') !== -1 ? '/Valorix/' : './';
          window.location.replace(repoPath);
        }
      })();
    </script>
  </head>
  <body style="background:#030303;color:#00FF9D;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">
    <div style="text-align:center;">
      <div style="width:36px;height:36px;border:3px solid rgba(0,255,157,0.2);border-top-color:#00FF9D;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
      <p style="font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;">Loading Velorix...</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  </body>
</html>
